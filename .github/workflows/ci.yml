name: CI

on:
  push:
    # Both names are listed so the build keeps working across the master -> main rename.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/CCS.SspNet.sln

      - name: Build
        run: dotnet build src/CCS.SspNet.sln --configuration Release --no-restore

      # Pull requests run the fast tier only. Slow and hardware tests are excluded here and
      # run on push to the default branch; hardware tests never run in CI at all.
      - name: Test (fast tier)
        if: github.event_name == 'pull_request'
        run: >
          dotnet test src/CCS.SspNet.sln
          --configuration Release --no-build
          --filter "Category!=Slow&Category!=Hardware"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Test (full suite)
        if: github.event_name != 'pull_request'
        run: >
          dotnet test src/CCS.SspNet.sln
          --configuration Release --no-build
          --filter "Category!=Hardware"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: >
          dotnet pack src/CCS.SspNet.sln
          --configuration Release
          --output ${{ runner.temp }}/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
