name: C++

on:
  push:
    branches: [main]
    paths: ["cpp/**", ".github/workflows/cpp.yml"]
  pull_request:
    paths: ["cpp/**", ".github/workflows/cpp.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The everyday build, with the sanitizers watching every test.
          - name: GCC, address and UB sanitizers
            cxx: g++
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          # The poll host runs on its own thread, so check it for races too.
          - name: GCC, thread sanitizer
            cxx: g++
            flags: -fsanitize=thread
          # ESP-IDF builds without exceptions or RTTI by default, so the core has to as well.
          - name: Clang, no exceptions or RTTI
            cxx: clang++
            flags: -fno-exceptions -fno-rtti

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S cpp -B cpp/build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DSMILEYSECURE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure

  esp-idf:
    name: ESP-IDF ${{ matrix.idf }}, ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - idf: v5.4
            target: esp32
          - idf: v5.4
            target: esp32s3
          - idf: v5.4
            target: esp32p4
          # The oldest release the component says it supports.
          - idf: v5.0
            target: esp32

    steps:
      - uses: actions/checkout@v4

      # Builds the example app, which compiles the core and the ESP32 pieces with ESP-IDF's
      # own flags: no exceptions, no RTTI, and warnings as errors.
      - name: Build the example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: cpp/examples/esp32_validator
