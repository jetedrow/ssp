name: Release

# Publishes SmileySecure.Net and SmileySecure.Net.Serial to nuget.org. Run by hand only: Actions > Release > Run
# workflow. Each run publishes 1.0.0-preview.<N>, where N is this workflow's run number, then tags
# the commit and creates a GitHub pre-release. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack only; publish nothing
        type: boolean
        default: false

permissions:
  contents: read

# Two releases racing each other would interleave tags and pushes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The pre-release label. Bump VersionPrefix in Directory.Build.props to change the release line.
  PRERELEASE_LABEL: preview

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        run: |
          prefix=$(dotnet msbuild src/SmileySecure.Net/SmileySecure.Net.csproj -getProperty:VersionPrefix)
          suffix="${PRERELEASE_LABEL}.${GITHUB_RUN_NUMBER}"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "version=${prefix}-${suffix}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${prefix}-${suffix}" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore src/SmileySecure.Net.sln

      - name: Build
        run: >
          dotnet build src/SmileySecure.Net.sln
          --configuration Release --no-restore
          -p:VersionSuffix=${{ steps.version.outputs.suffix }}

      # The full suite, as a push to main runs it. Hardware tests need a device and never run here.
      - name: Test
        run: >
          dotnet test src/SmileySecure.Net.sln
          --configuration Release --no-build
          --filter "Category!=Hardware"

      - name: Pack
        run: >
          dotnet pack src/SmileySecure.Net.sln
          --configuration Release --no-build
          -p:VersionSuffix=${{ steps.version.outputs.suffix }}
          --output ${{ runner.temp }}/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the tag and the GitHub release
      id-token: write   # for the trusted publishing token exchange

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # Trusted publishing: GitHub issues this run an OIDC token, and NuGet/login swaps it for a
      # short-lived API key (about an hour), provided a trusted publishing policy on nuget.org
      # matches this repository and this workflow file. No long-lived key is stored anywhere.
      - name: Check the nuget.org username is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository variable (or secret) is empty or missing. Add it under Settings > Secrets and variables > Actions. See docs/releasing.md."
            exit 1
          fi

      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg symbols package. There is deliberately
      # no --skip-duplicate: it turns nuget.org's 409 Conflict into a green step, so a push that
      # published nothing looked like a success.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json

      - name: Tag and create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: >
          gh release create "v${VERSION}"
          packages/*.nupkg packages/*.snupkg
          --target "${GITHUB_SHA}"
          --title "v${VERSION}"
          --prerelease
          --generate-notes
